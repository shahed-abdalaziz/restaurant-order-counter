<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Order Counter 🍔</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h2>Restaurant Order Counter 🍔</h2>
    <!-- Order Input Form -->
    <form action="">
        <input type="text" id="itemName" placeholder="Item Name" required>
        <input type="number" id="quantity" placeholder="Quantity" min="1" required>
        <input type="number" id="price" placeholder="Price" min="0" step="0.5" required>
        <button type="submit" id="addBtn">Add Order</button>
    </form>

    <!-- Orders Table -->
    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Subtotal</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="ordersTable">
            <!-- Order rows dynamically inserted via JS -->
        </tbody>
    </table>


    <!-- Grand Total Display Card -->
    <div class="total-box">
        Grand Total: $<span id="grandTotal">0.00</span>
    </div>



    <script src="script.js"></script>
</body>

</html>
