<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Order Counter 🍔</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h2>Restaurant Order Counter 🍔</h2>
    <!-- Order Input Form -->
    <form action="">
        <input type="text" id="itemName" placeholder="Item Name" required>
        <input type="number" id="quantity" placeholder="Quantity" min="1" required>
        <input type="number" id="price" placeholder="Price" min="0" step="0.5" required>
        <button type="submit" id="addBtn">Add Order</button>
    </form>


    <script src="script.js"></script>
</body>

</html>
